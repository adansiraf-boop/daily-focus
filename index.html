<!doctype html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2a6b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-180.png">
<title>Daily Focus</title>
<script>try{var m=localStorage.getItem("df_theme")||"auto";document.documentElement.dataset.theme=(m==="dark"||(m==="auto"&&matchMedia("(prefers-color-scheme:dark)").matches))?"dark":"light"}catch(e){}</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:root{--ink:#0b1b3a;--mut:#5b6b8c;--a1:#2f7bff;--a2:#0b2a6b;--ln:#e1e9f6;--g:linear-gradient(135deg,#2f7bff 0%,#173f9c 55%,#0b2a6b 100%)}
html,body{margin:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);min-height:100vh;
background:radial-gradient(600px 300px at 90% -5%,var(--r1) 0,transparent 70%),radial-gradient(500px 280px at -10% 0,var(--r2) 0,transparent 70%),var(--bg);background-attachment:fixed}
button{font:inherit;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 18px 170px}
.hd{display:flex;justify-content:space-between;align-items:center}
.hd b{font-size:18px}
.pill{border:1px solid var(--ln);background:var(--card);border-radius:99px;padding:6px 12px;font-size:12px;color:var(--mut)}
.hero{margin-top:12px;border-radius:24px;padding:20px;color:#fff;background:var(--g);box-shadow:0 12px 30px -12px rgba(11,42,107,.55)}
.hero h1{margin:0;font-size:24px}.hero p{margin:4px 0 16px;opacity:.85}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .5s}
.hero small{display:block;margin-top:8px;opacity:.9}
h2{font-size:14px;color:var(--mut);margin:24px 4px 10px;font-weight:600}
.it{display:flex;gap:12px;align-items:center;padding:14px;margin-bottom:10px;border-radius:18px;background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--ln)}
.ck{width:34px;height:34px;flex:none;border-radius:50%;border:2px solid var(--bd);background:var(--solid);color:#fff;font-size:16px;transition:.2s}
.done .ck{background:var(--g);border-color:transparent}
.done b{text-decoration:line-through;color:var(--mut)}
.bd{flex:1;min-width:0}.bd b{display:block;font-weight:600}.bd small{color:var(--mut)}
.bg{font-style:normal;font-size:11px;background:var(--chbg);color:var(--chc);padding:2px 8px;border-radius:99px}
.mv{border:0;background:var(--soft);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--ink)}
.nt{margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--ntbg);color:var(--ntc);font-size:14px}
.nt.warn{background:var(--wbg);color:var(--wc)}
.em{text-align:center;color:var(--mut);padding:26px 16px;border:1.5px dashed var(--bd);border-radius:20px;font-size:15px}
.em b{display:block;color:var(--ink);margin-bottom:4px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:var(--navbg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--ln)}
nav button{flex:1;border:0;background:none;color:var(--mut);font-size:11px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .on{color:var(--a1);font-weight:600}
#fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:22px;border:0;background:var(--g);color:#fff;font-size:34px;line-height:1;box-shadow:0 12px 26px -8px rgba(11,42,107,.6);transition:transform .15s}
#fab:active{transform:scale(.92)}
.ov{position:fixed;inset:0;background:rgba(11,27,58,.4);display:flex;align-items:flex-end;animation:fd .2s}
.sh{width:100%;max-width:560px;margin:0 auto;background:var(--solid);border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}@keyframes fd{from{opacity:0}}
input,select{width:100%;font:inherit;padding:13px 14px;border:1.5px solid var(--ln);border-radius:14px;background:var(--inp);margin:6px 0 12px;color:var(--ink)}
input:focus,select:focus{outline:2px solid #a9c6ff;border-color:var(--a2)}
label{font-size:13px;color:var(--mut)}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
label.chk{display:flex;align-items:center;gap:10px;margin:4px 0 12px;color:var(--ink);font-size:15px}
.chk input{width:22px;height:22px;margin:0;flex:none}
.btn{width:100%;padding:15px;border:0;border-radius:16px;font-weight:600;background:var(--g);color:#fff;margin-top:6px}
.btn.l{background:var(--soft);color:var(--ink)}.btn.r{background:var(--wbg);color:var(--wc)}
.wk{display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px}
.nv{width:40px;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--solid);font-size:20px;color:var(--ink)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dy{border:1px solid var(--ln);background:var(--card);border-radius:16px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink)}
.dy small{color:var(--mut);font-size:11px}
.dy.on{background:var(--g);color:#fff;border-color:transparent}.dy.on small{color:#dbe7ff}
.dy i{width:70%;height:4px;border-radius:4px;background:rgba(60,100,170,.16);position:relative;overflow:hidden}
.dy i:after{content:"";position:absolute;inset:0;width:var(--p);background:var(--a2);border-radius:4px}
.dy.on i:after{background:#fff}.dy.td b{text-decoration:underline}
.sk{height:64px;border-radius:18px;margin-bottom:10px;background:linear-gradient(90deg,var(--soft) 25%,var(--soft2) 50%,var(--soft) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
#toast{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);background:#143a8f;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9;text-align:center}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
textarea{width:100%;font:inherit;padding:13px 14px;border:1.5px solid var(--ln);border-radius:14px;background:var(--inp);margin:6px 0 12px;color:var(--ink);resize:vertical}
textarea:focus{outline:2px solid #a9c6ff;border-color:var(--a1)}
.sg{display:flex;gap:6px;padding:4px;margin-top:14px;border-radius:16px;background:var(--soft)}
.sg button{flex:1;border:0;border-radius:12px;padding:10px 0;background:none;color:var(--mut);font-weight:600}
.sg .on{background:var(--solid);color:var(--a2);box-shadow:0 2px 8px rgba(11,42,107,.12)}
a.btn{display:block}.hero .btn{margin-top:0}
.sh,.it,input,select,textarea,nav,.pill{transition:background-color .25s,border-color .25s}
:root{--bg:#fff;--r1:#cfe2ff;--r2:#e4eeff;--card:rgba(255,255,255,.75);--solid:#fff;--soft:#eaf0fb;--soft2:#f5f8ff;--inp:#f7faff;--navbg:rgba(255,255,255,.82);--bd:#c9d7ee;--ntbg:#eaf2ff;--ntc:#0b2a6b;--chbg:#fff1e6;--chc:#c2570c;--wbg:#fff1ee;--wc:#b42318}
:root[data-theme=dark]{color-scheme:dark;--ink:#e6edfb;--mut:#9aa9c8;--a1:#4d8dff;--a2:#8fb4ff;--ln:#1e2c4a;--bg:#071022;--r1:#11306b;--r2:#0b1d42;--card:rgba(18,32,62,.72);--solid:#0f1b36;--soft:#182848;--soft2:#1d2f54;--inp:#0c172e;--navbg:rgba(9,18,38,.85);--bd:#2c3e66;--ntbg:#14284f;--ntc:#b9d1ff;--chbg:#3a2412;--chc:#ffb27a;--wbg:#3a1a1a;--wc:#ff9b8f}
.pl{display:flex;gap:8px}
.ib{position:relative;width:40px;height:40px;border-radius:13px;border:1px solid var(--ln);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ib i{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:#22c55e;border:2px solid var(--solid)}.ib i.w{background:#f59e0b}
.sp svg{animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.rg{position:relative;width:220px;height:220px;margin:0 auto 18px}.rg svg{width:100%;height:100%;transform:rotate(-90deg)}
.r0{fill:none;stroke:var(--soft);stroke-width:12}.r1{fill:none;stroke:var(--a1);stroke-width:12;stroke-linecap:round;stroke-dasharray:565.5;transition:stroke-dashoffset .5s linear}
#ft{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:700;font-variant-numeric:tabular-nums}
.it{margin:0;padding:12px 14px;gap:12px;border-radius:0;border-top-width:0}
:not(.it)+.it{border-top-width:1px;border-radius:18px 18px 0 0}
.it:has(+:not(.it)),.it:last-child{border-radius:0 0 18px 18px}
:not(.it)+.it:has(+:not(.it)),:not(.it)+.it:last-child{border-radius:18px}
.ck{width:22px;height:22px;border-width:1.5px;font-size:12px;line-height:1;padding:0}
.bd b{font-size:15px}.bd small{font-size:13px}
.mv{padding:7px 12px;font-size:13px}
.dv{position:fixed;inset:0;z-index:30;background:rgba(11,27,58,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:24px;animation:fd .2s}
.dg{width:100%;max-width:340px;background:var(--solid);border:1px solid var(--ln);border-radius:26px;padding:24px 20px 18px;text-align:center;box-shadow:0 24px 60px -16px rgba(11,42,107,.5);animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
.di{width:54px;height:54px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--ntbg);color:var(--a1)}
.di.d{background:var(--wbg);color:var(--wc)}
.di svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dg h3{margin:0 0 6px;font-size:18px}.dg p{margin:0 0 18px;color:var(--mut);font-size:14px;line-height:1.5}
.dr{display:flex;gap:10px}.dr .btn{margin:0}.btn.dd{background:#e5484d;color:#fff}
.ck.lk{opacity:.5;cursor:default}
</style></head>
<body>
<main id="main"></main>
<button id="fab" data-act="add" aria-label="Tambah tugas" hidden>+</button>
<nav id="nav" hidden>
<button data-act="nav" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>Hari Ini</button>
<button data-act="nav" data-tab="agenda"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</button>
<button data-act="nav" data-tab="belajar"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2zM4 19a2 2 0 012-2h13"/></svg>Belajar</button>
<button data-act="nav" data-tab="jurnal"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"/></svg>Jurnal</button>
<button data-act="nav" data-tab="daftar"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>Daftar</button>
</nav>
<div id="sheet"></div><div id="toast"></div><div id="dlg"></div>
<script>
const $=s=>document.querySelector(s),LS=k=>localStorage.getItem(k);
const TM={auto:'Otomatis',light:'Terang',dark:'Gelap'};
const applyTheme=()=>{const m=LS('df_theme')||'auto',d=m==='dark'||(m==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';$('meta[name=theme-color]').content=d?'#071022':'#0b2a6b'};
applyTheme();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-');return new Date(+a,+b-1,+c)};
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const mon=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const today=()=>ymd(new Date());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(s,o)=>parse(s).toLocaleDateString('id-ID',o);

let cfg=JSON.parse(LS('df_cfg')||'null'),db=JSON.parse(LS('df_db')||'{}'),queue=JSON.parse(LS('df_q')||'[]');
const KEYS=['Agenda','LCKH','Daftar','Diary','DailyReview','LearningQueue','Notes','Habits','HabitLogs','FokusLog','Rapat','Settings'],fixDb=()=>KEYS.forEach(k=>db[k]=db[k]||[]);fixDb();
let tab='today',selDate=today(),wk=mon(today()),syncing=false,sheetRow=null;
const loaded=()=>!!LS('df_db');
const save=()=>{localStorage.setItem('df_db',JSON.stringify(db));localStorage.setItem('df_q',JSON.stringify(queue))};
const set=(k,d)=>{const r=db.Settings.find(x=>x.id===k);return r&&r.nilai!==''?r.nilai:d};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)};

/* ---- sinkronisasi ---- */
async function api(ops,c=cfg){
  const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:c.token,ops})});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'gagal');return j.results;
}
async function sync(){
  if(!cfg||syncing||!navigator.onLine){render();return}
  syncing=true;render();let ok=1;
  try{
    if(queue.length){const n=queue.length,res=await api(queue.slice());if(res.some(x=>!x.ok))throw new Error('gagal');queue.splice(0,n);save()}
    const r=await api([{action:'all'}]);
    if(!queue.length){db=r[0].data;fixDb();save();const u=location.origin+location.pathname;if(set('app_url','')!==u)upsert('Settings',{id:'app_url',nilai:u})}
  }catch(e){ok=0;toast('Sinkronisasi gagal, data aman di HP')}
  syncing=false;render();if(ok&&queue.length)sync();
}
function upsert(sh,row){
  const L=db[sh],i=L.findIndex(x=>x.id===row.id);i<0?L.push(row):L[i]=row;
  queue.push({action:'upsert',sheet:sh,row});save();render();sync();
}
function del(sh,id){db[sh]=db[sh].filter(x=>x.id!==id);queue.push({action:'delete',sheet:sh,id});save();render();sync()}

/* ---- data ---- */
const act=d=>db.Agenda.filter(a=>a.tanggal===d&&a.status!=='batal'&&a.status!=='dipindah').sort((a,b)=>(a.jam_mulai||'99').localeCompare(b.jam_mulai||'99'));
const mins=d=>act(d).reduce((s,a)=>s+(+a.durasi_menit||0),0);
const cap=()=>+set('batas_beban_menit',480)||480;

/* ---- tampilan ---- */
const sk=()=>'<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
const item=a=>{const d=a.status==='selesai',lk=d&&isLocked(a);return `<div class="it ${d?'done':''}"><button class="ck${lk?' lk':''}" data-act="tg" data-id="${a.id}" aria-label="${lk?'Terkunci':'Tandai selesai'}">${d?'✓':''}</button><div class="bd" data-act="ed" data-id="${a.id}"><b>${esc(a.judul)}</b><small>${[a.jam_mulai,a.durasi_menit?a.durasi_menit+' menit':'',a.tipe].filter(Boolean).join(' · ')} ${a.sumber==='mendadak'?'<i class="bg">Mendadak'+(a.pemberi_tugas?' · '+esc(a.pemberi_tugas):'')+'</i>':''} ${a.tipe==='rapat'&&a.status==='selesai'&&!db.Rapat.some(x=>x.id===a.id)?'<i class="bg">Hasil belum diisi</i>':''}</small></div></div>`};
const empty=(t,s)=>`<div class="em"><b>${t}</b>${s}</div>`;

function vToday(){
  const t=today(),L=act(t),od=db.Agenda.filter(a=>a.tanggal<t&&a.status==='todo'),done=L.filter(a=>a.status==='selesai').length;
  const pct=L.length?Math.round(done/L.length*100):0,m=mins(t),c=cap(),h=new Date().getHours();
  const hi=h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam';
  const pri=L.filter(a=>a.is_utama==='1'),rest=L.filter(a=>a.is_utama!=='1');
  let nt='';
  if(m>c)nt=`<div class="nt warn">Hari ini terlalu padat (${m} dari ${c} menit). Pindahkan tugas yang kurang penting ke besok.</div>`;
  else if(L.length&&m>0&&m<c*.3)nt=`<div class="nt">Hari ini masih longgar. Isi dengan tugas tertunda atau belajar satu hal baru.</div>`;
  const wait=!loaded()&&syncing;
  return `<div class="hd"><b>Daily Focus</b>${pill()}</div>
  <div class="hero"><h1>${hi}</h1><p>${fmt(t,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p><div class="bar"><i style="width:${pct}%"></i></div><small>${done} dari ${L.length} tugas selesai${m?' · '+m+' menit terencana':''}</small></div>${fcard()}${wait?'':nt}
  ${wait?sk():`<h2>Prioritas utama</h2>${pri.length?pri.map(item).join(''):empty('Belum ada prioritas','Tandai sampai 3 tugas sebagai prioritas utama.')}
  <h2>Tugas lain</h2>${rest.length?rest.map(item).join(''):empty('Belum ada tugas lain','Tekan + untuk menambah tugas hari ini.')}
  ${od.length?`<h2>Tertunda dari hari sebelumnya</h2>${od.map(a=>`<div class="it"><button class="ck" data-act="tt" data-id="${a.id}" aria-label="Tandai selesai"></button><div class="bd" data-act="ed" data-id="${a.id}"><b>${esc(a.judul)}</b><small>${fmt(a.tanggal,{day:'numeric',month:'short'})}</small></div><button class="mv" data-act="mt" data-id="${a.id}">Pindah ke hari ini</button></div>`).join('')}`:''}`}`;
}
function vAgenda(){
  const names=['Sen','Sel','Rab','Kam','Jum','Sab','Min'],L=act(selDate);let d7='';
  for(let i=0;i<7;i++){const d=addD(wk,i);d7+=`<button class="dy ${d===selDate?'on':''} ${d===today()?'td':''}" data-act="sd" data-d="${d}"><small>${names[i]}</small><b>${+d.slice(8)}</b><i style="--p:${Math.min(100,mins(d)/cap()*100)}%"></i></button>`}
  const m=mins(selDate);
  return `<div class="hd"><b>Agenda</b>${pill()}</div>
  <div class="wk"><button class="nv" data-act="wp" aria-label="Minggu lalu">‹</button><b>${fmt(wk,{day:'numeric',month:'short'})} – ${fmt(addD(wk,6),{day:'numeric',month:'short',year:'numeric'})}</b><button class="nv" data-act="wn" aria-label="Minggu depan">›</button></div>
  <div class="days">${d7}</div>
  <h2>${fmt(selDate,{weekday:'long',day:'numeric',month:'long'})}${m?' · '+m+' menit':''}</h2>
  ${!loaded()&&syncing?sk():L.length?L.map(item).join(''):empty('Belum ada agenda','Tekan + untuk menambah tugas di tanggal ini.')}`;
}
const SOON={belajar:'Belajar',catatan:'Catatan',daftar:'Daftar'};
const vSoon=()=>`<div class="hd"><b>${SOON[tab]}</b>${pill()}</div><div style="margin-top:24px">${empty('Segera hadir','Fitur ini dibuat di tahap berikutnya.')}</div>`;
const vSetup=()=>`<div style="margin-top:40px"><h1 style="margin:0 0 6px">Hubungkan Daily Focus</h1><p style="color:var(--mut);margin:0 0 20px">Masukkan URL web app dan token dari Google Sheets-mu. Cukup sekali.</p>
<label>URL web app</label><input id="c_url" inputmode="url" placeholder="https://script.google.com/macros/s/.../exec">
<label>Token rahasia</label><input id="c_tok" type="password" placeholder="Token dari menu Daily Focus">
<button class="btn" data-act="cn">Hubungkan</button></div>`;

function render(){
  const ok=!!cfg;$('#nav').hidden=!ok;$('#fab').hidden=!ok;
  $('#main').innerHTML=!ok?vSetup():({today:vToday,agenda:vAgenda,belajar:vBelajar,jurnal:vJurnal,daftar:vDaftar}[tab]||vToday)();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
}

/* ---- form tugas ---- */
function openSheet(id){
  const r=id?db.Agenda.find(a=>a.id===id):null;sheetRow=r;
  const v=k=>esc(r?r[k]:''),d=r?r.tanggal:(tab==='agenda'?selDate:today()),md=r&&r.sumber==='mendadak';
  const ty=['kerja','rapat','belajar','pribadi','hiburan'].map(x=>`<option ${r&&r.tipe===x?'selected':''}>${x}</option>`).join('');
  $('#sheet').innerHTML=`<div class="ov" data-act="cl"><div class="sh"><h2 style="margin-top:0">${r?'Ubah tugas':'Tugas baru'}</h2>${r&&r.status==='selesai'?'<p style="color:var(--mut);font-size:13px;margin:-4px 0 12px">Tugas yang sudah selesai tidak bisa dihapus atau dipindah tanggal. Isinya masih bisa diedit.</p>':''}
  <label>Judul</label><input id="f_judul" value="${v('judul')}" placeholder="Apa yang harus dikerjakan?">
  <div class="row"><div><label>Tanggal</label><input id="f_tgl" type="date" value="${d}" ${r&&r.status==='selesai'?'disabled':''}></div><div><label>Jam</label><input id="f_jam" type="time" value="${v('jam_mulai')}"></div></div>
  <div class="row"><div><label>Durasi (menit)</label><input id="f_dur" type="number" inputmode="numeric" value="${v('durasi_menit')}" placeholder="30"></div><div><label>Tipe</label><select id="f_tipe">${ty}</select></div></div>
  <label class="chk"><input id="f_utama" type="checkbox" ${r&&r.is_utama==='1'?'checked':''}>Prioritas utama (maks. 3 per hari)</label>
  <label class="chk"><input id="f_mdk" type="checkbox" ${md?'checked':''} onchange="document.getElementById('f_ptw').hidden=!this.checked">Kerjaan mendadak</label>
  <div id="f_ptw" ${md?'':'hidden'}><label>Pemberi tugas</label><input id="f_pt" value="${v('pemberi_tugas')}" placeholder="Mis. Kabid, Atasan"></div>
  ${r&&r.tipe==='rapat'?'<button class="btn l" data-act="hr" data-id="'+r.id+'">'+(db.Rapat.some(x=>x.id===r.id)?'Lihat / ubah hasil rapat':'Isi hasil rapat')+'</button>':''}<button class="btn" data-act="sv">Simpan</button>
  ${r&&r.status!=='selesai'?'<button class="btn l" data-act="mv">Pindah ke besok</button><button class="btn r" data-act="dl">Hapus</button>':''}</div></div>`;
  if(!r)setTimeout(()=>$('#f_judul').focus(),300);
}
const closeSheet=()=>{$('#sheet').innerHTML='';sheetRow=null};
const byId=id=>db.Agenda.find(a=>a.id===id);

const A={
  nav(t){tab=t.dataset.tab;render();scrollTo(0,0)},
  add(){tab==='today'||tab==='agenda'?openSheet():addOther()},ed(t){openSheet(t.dataset.id)},cl:closeSheet,sy:sync,
  tg(t){const a=byId(t.dataset.id),d=a.status==='selesai';if(d&&(a.tanggal_selesai||a.tanggal)<today()){toast('Tugas dari hari yang sudah lewat terkunci');return}upsert('Agenda',{...a,status:d?'todo':'selesai',tanggal_selesai:d?'':today()})},
  mt(t){const a=byId(t.dataset.id);upsert('Agenda',{...a,tanggal:today(),pindah_dari:a.tanggal})},
  wp(){wk=addD(wk,-7);selDate=wk;render()},wn(){wk=addD(wk,7);selDate=wk;render()},
  sd(t){selDate=t.dataset.d;render()},
  sv(){
    const j=$('#f_judul').value.trim();if(!j){toast('Judul wajib diisi');return}
    const o=sheetRow,tgl=o&&o.status==='selesai'?o.tanggal:($('#f_tgl').value||today()),mdk=$('#f_mdk').checked;
    let ut=$('#f_utama').checked?'1':'0';
    if(ut==='1'&&act(tgl).filter(a=>a.is_utama==='1'&&(!o||a.id!==o.id)).length>=3){ut='0';toast('Maksimal 3 prioritas utama per hari')}
    const r={status:'todo',pindah_dari:'',tanggal_selesai:'',catatan:'',created_at:new Date().toISOString(),...(o||{}),
      id:o?o.id:'a'+Date.now().toString(36),tanggal:tgl,jam_mulai:$('#f_jam').value,durasi_menit:$('#f_dur').value,judul:j,
      tipe:$('#f_tipe').value,prioritas:ut==='1'?'tinggi':'biasa',is_utama:ut,sumber:mdk?'mendadak':'rencana',pemberi_tugas:mdk?$('#f_pt').value.trim():''};
    closeSheet();if(tab==='agenda'){selDate=tgl;wk=mon(tgl)}upsert('Agenda',r);
  },
  mv(){const a=sheetRow,t=addD(a.tanggal>today()?a.tanggal:today(),1);closeSheet();upsert('Agenda',{...a,tanggal:t,pindah_dari:a.tanggal});toast('Dipindah ke '+fmt(t,{weekday:'long',day:'numeric',month:'short'}))},
  
  async cn(){
    const c={url:$('#c_url').value.trim(),token:$('#c_tok').value.trim()};
    if(!c.url||!c.token){toast('Isi URL dan token');return}
    try{await api([{action:'ping'}],c);cfg=c;localStorage.setItem('df_cfg',JSON.stringify(c));sync()}
    catch(e){toast('Gagal terhubung. Cek URL dan token.')}
  }
};

function openForm(sh,id,d={}){
  const c=F[sh],row=id?db[sh].find(x=>x.id===id):null;fm={sh,id,row,d};
  const val=k=>sh==='Settings'?(k==='_tema'?TM[LS('df_theme')||'auto']:set(k,'')):row?row[k]:(d[k]??'');
  const inp=([k,l,t,x])=>{const v=esc(val(k));
    const h=t==='area'?`<textarea id="g_${k}" rows="3">${v}</textarea>`
    :t==='sel'?`<select id="g_${k}">${x.map(o=>`<option ${val(k)===o?'selected':''}>${o}</option>`).join('')}</select>`
    :`<input id="g_${k}" type="${t}" ${t==='number'?'inputmode="numeric"':''} value="${v||(!row&&x?esc(x):'')}">`;
    return `<label>${l}</label>${h}`};

const SR={Agenda:['judul','catatan','pemberi_tugas'],LCKH:['uraian_kegiatan','output_hasil','keterangan'],Daftar:['item','catatan'],Diary:['isi','tag'],Notes:['poin_1','poin_2','poin_3','aksi_nyata'],LearningQueue:['judul','channel','topik']};

const beep=()=>{try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+1);o.start();o.stop(c.currentTime+1)}catch(e){}};
const fcard=()=>{const L=db.FokusLog.filter(x=>x.tanggal===today()),m=L.reduce((s,x)=>s+(+x.menit||0),0);return `<div class="it" style="margin-top:14px"><div class="bd"><b>Timer fokus</b><small>${L.length} sesi · ${m} menit hari ini</small></div><button class="mv" data-act="fs">${focus?'Lanjutkan':'Mulai'}</button></div>`};
const doneUI=()=>(focus.brk?'<p style="color:var(--mut)">Istirahat selesai.</p>':'<p style="color:var(--mut)">Sesi selesai. Mantap!</p>')+(focus.id&&!focus.brk?'<button class="btn" data-act="fd">Tandai tugas selesai</button>':'')+(focus.brk?'':'<button class="btn l" data-act="fb5">Istirahat 5 menit</button>')+'<button class="btn l" data-act="fc2">Tutup</button>';
function showFocus(){
  $('#sheet').innerHTML=`<div class="ov"><div class="sh" style="text-align:center"><p style="color:var(--mut);margin:0">${focus.brk?'Istirahat':'Fokus pada'}</p><h2 style="margin:4px 0 14px;font-size:20px;color:var(--ink)">${esc(focus.label)}</h2>
  <div class="rg"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="90" class="r0"/><circle id="fr" cx="100" cy="100" r="90" class="r1"/></svg><div id="ft">00:00</div></div>
  <div id="fb">${focus.done?doneUI():'<button class="btn r" data-act="fx">Batalkan</button>'}</div></div></div>`;
  tick();clearInterval(tm);if(!focus.done)tm=setInterval(tick,500);
}
function tick(){
  if(!focus||!$('#ft'))return;
  const left=focus.done?0:Math.max(0,focus.end-Date.now()),s=Math.ceil(left/1000);
  $('#ft').textContent=pad(Math.floor(s/60))+':'+pad(s%60);
  $('#fr').style.strokeDashoffset=565.5*(1-left/(focus.dur*60000));
  if(left===0&&!focus.done)finishFocus();
}
function finishFocus(){
  focus.done=true;putF();clearInterval(tm);relWL();ring();notif(focus.brk?'Istirahat selesai':'Fokus selesai',focus.label);
  if(!focus.brk)upsert('FokusLog',{id:'f'+Date.now().toString(36),tanggal:ymd(new Date(focus.end)),task_id:focus.id,judul:focus.label,menit:String(focus.dur),selesai_pada:new Date(focus.end).toISOString()});
  if($('#fb'))$('#fb').innerHTML=doneUI();
}

/* ---- dialog konfirmasi bergaya aplikasi ---- */
function ask(t,m,ok='Ya',danger=false){return new Promise(res=>{
  const el=$('#dlg'),kd=e=>{if(e.key==='Escape')done(false)},done=v=>{el.innerHTML='';el.onclick=null;document.removeEventListener('keydown',kd);res(v)};
  const ic=danger?'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/>':'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-.8.6-1.5 1-1.5 2M12 17h.01"/>';
  el.innerHTML=`<div class="dv"><div class="dg" role="alertdialog" aria-modal="true" aria-labelledby="dgt"><div class="di ${danger?'d':''}"><svg viewBox="0 0 24 24">${ic}</svg></div><h3 id="dgt">${esc(t)}</h3><p>${m}</p><div class="dr"><button class="btn l" data-d="0">Batal</button><button class="btn ${danger?'dd':''}" data-d="1">${esc(ok)}</button></div></div></div>`;
  el.onclick=e=>{const b=e.target.closest('[data-d]');if(b)done(b.dataset.d==='1');else if(e.target.classList.contains('dv'))done(false)};
  document.addEventListener('keydown',kd);setTimeout(()=>{const b=el.querySelector('[data-d="0"]');b&&b.focus()},60)})}
